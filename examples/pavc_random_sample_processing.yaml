version: 1

execution:
  # local: isolated Dask worker processes on this machine
  # dask: connect to scheduler_address
  # slurm: create workers through dask-jobqueue
  method: local
  workers: 8
  threads_per_worker: 1

selection:
  aoi: ../data/aois/pavc_random_sample.geojson
  aoi_id_field: site_visit_id
  years: [2023, 2024]
  speriod: "06-01"
  eperiod: "08-31"

output_grid:
  crs: EPSG:3338
  resolution: 20
  extent: aoi
  anchor: [0, 0]
  chunks: {y: 1024, x: 1024}

sources:
  s2:
    type: s2.l2a.local
    data_dir: ../data/s2/raw

  arcticdem:
    type: dem.local
    data_dir: ../data/arcticdem/10m
    pattern: "*.tif"

nodes:
  # S2 processing steps
  # 1. preprocess sentinel-2 bands
  - id: preprocess
    type: s2.preprocess
    source: s2
    bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
    mask_classes: [0, 1, 3, 8, 9, 10, 11]
    nodata: 65535

  # 2. create one summer representative composite per band
  - id: all-composite
    type: composite
    inputs: {data: preprocess}
    period: all
    aggregation: median

  # 3. calculate indices from the composite
  - id: indices
    type: s2.index
    inputs: {data: all-composite}
    indices: [NDGI, NDWI1]

  # ArcticDEM processing steps
  # 1. calculate terrain features from the DEM
  - id: terrain
    type: dem
    source: arcticdem
    features: [elevation, aspect, slope, hillshade]
    algorithm: Horn
    hillshade_azimuth: 315
    hillshade_altitude: 45

# Point AOIs are sampled into wide Parquet rows, one per point and time representation.
outputs:
  composited:
    from: indices
    path: ../data/s2/pavc_samples
    format: parquet

  terrain:
    from: terrain
    path: ../data/arcticdem/pavc_samples
    format: parquet
