version: 1

execution:
  # local: isolated Dask worker processes on this machine
  # dask: connect to scheduler_address
  # slurm: create workers through dask-jobqueue
  method: local
  workers: 4
  threads_per_worker: 1

selection:
  aoi: ../data/aois/toolik_025_aoi.geojson
  years: [2023, 2024]
  speriod: "06-01"
  eperiod: "08-31"

output_grid:
  crs: EPSG:3338
  resolution: 20
  extent: aoi
  anchor: [0, 0]
  chunks: {y: 1024, x: 1024}

sources:
  s2:
    type: s2.l2a.local
    data_dir: ../data/s2/raw

# processing pipeline
nodes:
  - id: preprocess
    type: s2.preprocess
    source: s2
    bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
    mask_classes: [0, 1, 3, 8, 9, 10, 11]
    nodata: 65535

  - id: all-composite
    type: composite
    inputs: {data: preprocess}
    period: all
    aggregation: median

  - id: indices
    type: s2.index
    inputs: {data: all-composite}
    indices: [NDGI, NDWI1]

outputs:
  composited:
    from: indices
    path: ../data/s2/summer_15D_med_indices
    format: cog
